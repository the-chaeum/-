<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교통사고 예상 합의금 진단 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; line-height: 1.6; }
        h1 { text-align: center; font-size: 1.5em; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .hidden { display: none !important; }
        .vip-filter { background-color: #fff3f3; border: 2px solid #ff4d4d; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
        .calc-btn { background-color: #007bff; color: white; border: none; padding: 15px; font-size: 1.2em; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
        .submit-db-btn { background-color: #ffe812; color: #3c1e1e; border: none; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
        .disclaimer { font-size: 0.8em; color: #888; text-align: center; margin-top: 15px; padding: 10px; background: #f1f1f1; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>교통사고 경상환자 예상 합의금 계산</h1>

    <div class="vip-filter" id="vipFilterBox">
        <label><input type="checkbox" id="vipCheck"> 🚨 골절, 인대 파열, 또는 수술을 받으셨나요?</label>
    </div>

    <div id="normalForm">
        <form id="calcForm">
            <div class="form-group"><label>1. 입원일수</label><input type="number" id="inDays" value="0"></div>
            <div class="form-group"><label>2. 통원일수</label><input type="number" id="outDays" value="0"></div>
            <div class="form-group">
                <label>3. 본인과실 (%)</label>
                <select id="faultRatio"><option value="0">0%</option><option value="20">20%</option><option value="50">50%</option></select>
            </div>
            <div class="form-group"><label>4. 월 소득액 (원)</label><input type="number" id="monthlyIncome" value="3500000"></div>
            <div class="form-group">
                <label>5. 상해급수</label>
                <select id="injuryLevel"><option value="150000">12~14급 (위자료 15만)</option><option value="250000">11급 (위자료 25만)</option></select>
            </div>
            <button type="button" class="calc-btn" onclick="processCalculation()">예상 합의금 리포트 확인하기</button>
        </form>
    </div>

    <div id="leadModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="resultDisplay">계산 완료!</h2>
            <p>항목별 상세 리포트를 문자로 보내드립니다.</p>
            <input type="text" id="userName" placeholder="이름" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="tel" id="userPhone" placeholder="연락처" style="width:100%; padding:10px; margin-bottom:10px;">
            <button class="submit-db-btn" onclick="submitLead()">무료 리포트 전송받기</button>
        </div>
    </div>

    <div id="successMessage" class="hidden" style="text-align: center; padding: 40px;">
        <h2>✅ 전송 완료</h2>
        <p>잠시만 기다려주시면 담당 사정사가 연락드립니다.</p>
    </div>

    <script>
        let finalAmount = 0; // 계산된 금액을 저장할 변수

        function processCalculation() {
            const inDays = parseInt(document.getElementById('inDays').value) || 0;
            const outDays = parseInt(document.getElementById('outDays').value) || 0;
            const income = parseInt(document.getElementById('monthlyIncome').value) || 0;
            const fault = parseInt(document.getElementById('faultRatio').value) / 100;
            const baseValue = parseInt(document.getElementById('injuryLevel').value);

            // 기초 계산식 (심플 버전)
            const dailyIncome = (income / 30) * 0.85; // 휴업손해 (85%)
            const stayCost = dailyIncome * inDays; // 입원료
            const outCost = outDays * 8000; // 통원 교통비
            const futureCost = 500000; // 향후 치료비 (가정치)

            let total = baseValue + stayCost + outCost + futureCost;
            finalAmount = Math.round(total * (1 - fault)); // 과실 상계

            document.getElementById('resultDisplay').innerText = "예상 금액: 약 " + finalAmount.toLocaleString() + "원";
            document.getElementById('leadModal').classList.remove('hidden');
        }

        function submitLead() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJcaVYjXrhQdgZqI6uRAJVcPQ-a41IVza6f-nJvFhm20dNm7okqn8KkJ7YKgiNL85k/exec";

            if(!name || !phone) { alert('정보를 입력해주세요.'); return; }

            // 투명 iframe 방식 사용
            let iframe = document.createElement('iframe');
            iframe.name = 'hidden_iframe';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = GOOGLE_APP_SCRIPT_URL;
            form.target = 'hidden_iframe';

            const fields = { 'name': name, 'phone': phone, 'result': finalAmount.toLocaleString() + "원" };
            for (let key in fields) {
                let input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();

            setTimeout(() => {
                document.getElementById('leadModal').classList.add('hidden');
                document.getElementById('normalForm').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
            }, 500);
        }
    </script>
</body>
</html>
