<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교통사고 경상환자 예상 합의금 계산 프로그램</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        .hidden { display: none !important; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; font-family: 'Malgun Gothic', sans-serif; box-shadow: 0 4px 15px rgba(0,0,0,0.2);}
        .modal-content input[type="text"], .modal-content input[type="tel"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .privacy-box { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin: 15px 0; text-align: left; font-size: 0.85em; color: #555; }
        .privacy-box label { font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #333; }
        .privacy-box input[type="checkbox"] { transform: scale(1.2); margin: 0; }
        .submit-db-btn { background-color: #ffe812; color: #3c1e1e; border: none; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>교통사고 경상환자 예상 합의금 계산 프로그램</h2>
        <div>
            <label for="birthdate">1. 생년월일:</label>
            <input type="date" id="birthdate"><br>

            <label for="accidentDate">2. 사고일자:</label>
            <input type="date" id="accidentDate"><br>

            <label for="accidentType">3. 사고유형:</label>
            <select id="accidentType">
                <option value="carToCar">차대차</option>
                <option value="carToPerson">차대인</option>
                <option value="carToMotorcycle">차대오토바이</option>
                <option value="carToOther">차대기타</option>
            </select><br>

            <label for="hospitalDays">4. 입원일수:</label>
            <input type="number" id="hospitalDays" value="0"><br>

            <label for="clinicDays">5. 통원일수:</label>
            <input type="number" id="clinicDays" value="0"><br>

            <label for="userFault">6. 본인과실 (%):</label>
            <select id="userFault">
                <option value="0">0%</option>
                <option value="5">5%</option>
                <option value="10">10%</option>
                <option value="15">15%</option><option value="20">20%</option><option value="25">25%</option>
                <option value="30">30%</option><option value="35">35%</option><option value="40">40%</option>
                <option value="45">45%</option><option value="50">50%</option><option value="55">55%</option>
                <option value="60">60%</option><option value="65">65%</option><option value="70">70%</option>
                <option value="75">75%</option><option value="80">80%</option><option value="85">85%</option>
                <option value="90">90%</option><option value="95">95%</option>
            </select><br>

            <label for="injuryGrade">7. 상해급수:</label>
            <select id="injuryGrade">
                <option value="8">8급</option><option value="9">9급</option><option value="10">10급</option>
                <option value="11">11급</option><option value="12">12급</option><option value="13">13급</option>
                <option value="14">14급</option>
            </select><br>

            <label for="insuranceCost">8. 보험사 부담 치료비:</label>
            <input type="text" id="insuranceCost" placeholder="보험회사가 부담한 치료비를 직접 입력하세요. 모르면 생략 가능"> <span>원</span><br>

            <div id="incomeSection">
                <label>9. 월소득액:</label><br>
                <input type="radio" id="incomeDirectRadio" name="incomeOption" onclick="selectIncomeOption('direct')"> 직접입력(세금공제 후 금액)
                <input type="text" id="incomeInputDirect" placeholder="직접 월소득액을 입력하세요. 모르면 아래 도시일용임금 선택" disabled>
                <span>원</span><br>

                <input type="radio" id="incomeFixedRadio" name="incomeOption" onclick="selectIncomeOption('fixed')"> 도시일용임금(소득이 없거나 모르면 선택하세요)<br>
            </div>

            <label for="directPayment">10. 직불치료비:</label>
            <input type="text" id="directPayment" placeholder="본인이 직접 지불한 치료비를 입력하세요. 모르면 생략 가능"> <span>원</span><br>

            <button onclick="runCalcAndShowModal()">예상 합의금 계산하기</button>
        </div>

        <div class="result" id="result"></div>
    </div>

    <div id="leadModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 style="margin-top: 0; color: #007bff; font-size: 1.5em;">계산이 완료되었습니다! 📊</h2>
            <p style="font-size: 0.95em; color: #555;">산출된 <b>항목별 상세 결과와 전문가의 보상 팁</b>을 즉시 받아보시려면 정보를 입력해주세요.</p>
            
            <input type="text" id="userName" placeholder="이름 (예: 홍길동)" required>
            <input type="tel" id="userPhone" placeholder="연락처 (- 없이 숫자만)" required>
            
            <div class="privacy-box">
                <label>
                    <input type="checkbox" id="privacyConsent">
                    [필수] 개인정보 수집 및 이용 동의
                </label>
                <div style="margin-top: 8px; line-height: 1.4;">
                    - 수집 목적: 예상 합의금 결과 전송 및 보상 상담<br>
                    - 보유 기간: <b>수집일로부터 6개월 후 파기</b>
                </div>
            </div>
            
            <button class="submit-db-btn" onclick="submitLead()">결과 확인 및 전송받기</button>
            <p style="margin-top: 15px; font-size: 0.85em; color: #999; text-decoration: underline; cursor: pointer;" onclick="document.getElementById('leadModal').classList.add('hidden')">닫기</p>
        </div>
    </div>

    <div id="successMessage" class="modal-overlay hidden">
        <div class="modal-content" style="background: #eaf7ea;">
            <h2 style="color: #2e7d32; margin-top: 0;">✅ 전송 완료</h2>
            <p>담당 사정사가 내역을 확인 후 연락드리겠습니다.</p>
            <button class="submit-db-btn" style="background-color: #2e7d32; color: white;" onclick="document.getElementById('successMessage').classList.add('hidden')">확인</button>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        // 1. 버튼 누르면 원본 계산(calculate)을 실행하고 팝업 띄우기
        function runCalcAndShowModal() {
            if (typeof calculate === 'function') {
                calculate(); // script.js 안에 있는 대표님 공식 실행!
            } else {
                alert("계산 스크립트(script.js)를 불러오지 못했습니다.");
                return;
            }
            
            // 0.5초 뒤에 모달 띄우기 (계산될 시간을 살짝 줌)
            setTimeout(() => {
                document.getElementById('leadModal').classList.remove('hidden');
            }, 500);
        }

        // 2. 구글 시트로 이름, 연락처, "화면에 뜬 결과 전부 다" 보내기
        function submitLead() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const privacyChecked = document.getElementById('privacyConsent').checked;

            if(!name || !phone) { 
                alert('이름과 연락처를 정확히 입력해주세요.'); 
                return; 
            }
            if(!privacyChecked) {
                alert('개인정보 수집 및 이용에 동의하셔야 결과를 받아보실 수 있습니다.');
                return;
            }

            const submitBtn = document.querySelector('.submit-db-btn');
            submitBtn.innerText = "전송 중...";
            submitBtn.disabled = true;

            // 대표님의 구글 앱스 스크립트 주소
            const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJcaVYjXrhQdgZqI6uRAJVcPQ-a41IVza6f-nJvFhm20dNm7okqn8KkJ7YKgiNL85k/exec"; 

            // 💡 여기서 핵심! 대표님의 script.js가 뿌려놓은 화면 글씨(결과)를 통째로 긁어옵니다.
            const resultText = document.getElementById('result').innerText || "계산 결과가 없습니다.";

            // 투명 iframe을 이용한 무적 우회 전송
            let iframe = document.getElementById('hidden_iframe');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.name = 'hidden_iframe';
                iframe.id = 'hidden_iframe';
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
            }

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = GOOGLE_APP_SCRIPT_URL;
            form.target = 'hidden_iframe';

            // 데이터 포장 (이름, 연락처, 그리고 전체 계산 결과!)
            const fields = { 'name': name, 'phone': phone, 'result': resultText };
            for (let key in fields) {
                let input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit(); // 발사!

            setTimeout(() => {
                document.getElementById('leadModal').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
                form.remove(); 
                submitBtn.innerText = "결과 확인 및 전송받기";
                submitBtn.disabled = false;
            }, 500); 
        }
    </script>
</body>
</html>
